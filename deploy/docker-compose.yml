services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?请配置 MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?请配置 MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请配置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请配置 MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute="SELECT 1"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
  redis:
    image: redis:7-alpine
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请配置 REDIS_PASSWORD}

    command:
      - /bin/sh
      - -c
      - 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"'

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -qx PONG'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  server:
    build:
      context: ../campus-trade-server
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?请配置
      MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&sslMode=DISABLED"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?请配置 MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?请配置 MYSQL_PASSWORD}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?请配置 REDIS_PASSWORD}

      APP_JWT_SECRET: ${APP_JWT_SECRET:?请配置 APP_JWT_SECRET}
      JWT_EXPIRE_SECONDS: ${JWT_EXPIRE_SECONDS:-7200}

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "3"
        - http://localhost:8080/api/health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  nginx:
    build:
      context: ../campus-trade-web
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "${HTTP_PORT:-80}:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      server:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data: